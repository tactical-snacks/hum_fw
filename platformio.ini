; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; machine-specific settings (monitor_port) go in platformio_local.ini, which is gitignored:
;   [env:genericSTM32U031K8]
;   monitor_port = COM12
[platformio]
extra_configs = platformio_local.ini

; STM32U031K8U6 (Cortex-M0+, 56 MHz, 64 KB flash, 12 KB SRAM, UFQFPN32)
; No stock PlatformIO board exists for this part; see boards/genericSTM32U031K8.json
[env:genericSTM32U031K8]
platform = ststm32
board = genericSTM32U031K8
framework = arduino
board_build.mcu = stm32u031k8u6
board_build.f_cpu = 16000000L
board_build.ldscript = boards/STM32U031K8_FLASH.ld
build_flags =
    -DSTM32U0
    -DSTM32U0xx
    -DSTM32U031xx
upload_protocol = stlink
; firmware sleeps in Stop 2, where SWD is off: hold NRST (J3 pin 10) while connecting
upload_flags =
    -c
    reset_config srst_only srst_nogate connect_assert_srst
debug_tool = stlink
monitor_speed = 115200
